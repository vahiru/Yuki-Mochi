[build.env]
passthrough = ["PROTOC", "PROTOC_INCLUDE"]

[target.x86_64-unknown-linux-gnu]
pre-build = [
  "if command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y --no-install-recommends protobuf-compiler && rm -rf /var/lib/apt/lists/*; elif command -v apk >/dev/null 2>&1; then apk add --no-cache protobuf; else echo 'No supported package manager found for protoc install' >&2; exit 1; fi"
]

[target.x86_64-unknown-linux-musl]
pre-build = [
  "if command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y --no-install-recommends protobuf-compiler && rm -rf /var/lib/apt/lists/*; elif command -v apk >/dev/null 2>&1; then apk add --no-cache protobuf; else echo 'No supported package manager found for protoc install' >&2; exit 1; fi"
]


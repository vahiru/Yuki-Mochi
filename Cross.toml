[target.x86_64-unknown-linux-gnu]
pre-build = [
  "if command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y --no-install-recommends ca-certificates curl unzip && rm -rf /var/lib/apt/lists/*; elif command -v apk >/dev/null 2>&1; then apk add --no-cache ca-certificates curl unzip; else echo 'No supported package manager found for protoc install' >&2; exit 1; fi; PROTOC_VERSION=21.12; curl -fsSL -o /tmp/protoc.zip \"https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip\"; unzip -o /tmp/protoc.zip -d /usr/local; chmod +x /usr/local/bin/protoc; protoc --version; rm -f /tmp/protoc.zip"
]

